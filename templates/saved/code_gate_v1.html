<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drop Air - Enter Code</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --ink: #111827;
      --muted: #4b5563;
      --line: #d1d5db;
      --accent: #0369a1;
      --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, #e0f2fe 0, transparent 35%),
        radial-gradient(circle at 80% 80%, #cffafe 0, transparent 35%),
        var(--bg);
      color: var(--ink);
    }
    .card {
      width: min(420px, 92vw);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, .08);
    }
    h1 { margin: 0 0 10px; font-size: 1.4rem; }
    p { margin: 0 0 12px; color: var(--muted); }
    .error { color: var(--danger); margin-bottom: 8px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      font-size: 1rem;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      color: white;
      background: linear-gradient(90deg, #0369a1, #0891b2);
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <form class="card" method="post" action="/enter">
    <h1>Enter Access Code</h1>
    <p>This Drop Air server is protected by a one-time code.</p>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <input name="code" placeholder="Access code" autocomplete="one-time-code" />
    <button type="submit">Continue</button>
  </form>
</body>
</html>
