<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Drop Air Updater</title>
  <script>
    (function () {
      const saved = localStorage.getItem("dropAirTheme") || "system";
      document.documentElement.dataset.theme = ["light", "dark", "system"].includes(saved) ? saved : "system";
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fb;
      --wash-a: rgba(14, 165, 183, .13);
      --wash-b: rgba(249, 115, 91, .1);
      --surface: #ffffff;
      --surface-soft: #f0f8fb;
      --ink: #172033;
      --muted: #5d6f86;
      --line: #dce5ee;
      --accent: #0ea5b7;
      --accent-strong: #047b8f;
      --mint: #12b981;
      --danger: #d43f5e;
      --warning: #f59e0b;
      --shadow: 0 18px 60px rgba(36, 55, 84, .12);
      --radius: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b111b;
        --wash-a: rgba(34, 184, 200, .14);
        --wash-b: rgba(255, 138, 112, .09);
        --surface: #121b28;
        --surface-soft: #172636;
        --ink: #edf6ff;
        --muted: #9fb1c7;
        --line: #26384b;
        --accent: #22b8c8;
        --accent-strong: #5ee5f0;
        --mint: #34d399;
        --danger: #fb7185;
        --warning: #fbbf24;
        --shadow: 0 18px 60px rgba(0, 0, 0, .3);
      }
    }

    html[data-theme="light"] {
      --bg: #f5f7fb;
      --wash-a: rgba(14, 165, 183, .13);
      --wash-b: rgba(249, 115, 91, .1);
      --surface: #ffffff;
      --surface-soft: #f0f8fb;
      --ink: #172033;
      --muted: #5d6f86;
      --line: #dce5ee;
      --accent: #0ea5b7;
      --accent-strong: #047b8f;
      --mint: #12b981;
      --danger: #d43f5e;
      --warning: #f59e0b;
      --shadow: 0 18px 60px rgba(36, 55, 84, .12);
    }

    html[data-theme="dark"] {
      --bg: #0b111b;
      --wash-a: rgba(34, 184, 200, .14);
      --wash-b: rgba(255, 138, 112, .09);
      --surface: #121b28;
      --surface-soft: #172636;
      --ink: #edf6ff;
      --muted: #9fb1c7;
      --line: #26384b;
      --accent: #22b8c8;
      --accent-strong: #5ee5f0;
      --mint: #34d399;
      --danger: #fb7185;
      --warning: #fbbf24;
      --shadow: 0 18px 60px rgba(0, 0, 0, .3);
    }

    * { box-sizing: border-box; }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes progress-run {
      from { background-position: 0 0, 0 0; }
      to { background-position: 44px 0, 0 0; }
    }

    @keyframes pulse-ring {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.65); }
      30% { opacity: .85; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.45); }
    }

    @keyframes orbit-spin {
      to { transform: rotate(1turn); }
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(560px circle at 50% 12%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 54%),
        linear-gradient(120deg, var(--wash-a), transparent 34%),
        linear-gradient(260deg, var(--wash-b), transparent 30%),
        var(--bg);
    }

    button { font: inherit; }

    .wrap {
      width: min(920px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: max(22px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
      display: grid;
      align-content: center;
      gap: 18px;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mark {
      width: 48px;
      height: 48px;
      border-radius: var(--radius);
      display: grid;
      place-items: center;
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--mint));
      box-shadow: 0 12px 28px rgba(14, 165, 183, .24);
      flex: 0 0 auto;
    }

    .mark svg { width: 27px; height: 27px; }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.35rem);
      line-height: .96;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-weight: 700;
    }

    .version-chip,
    .secondary-btn {
      min-height: 40px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 12px;
      font-weight: 800;
    }

    .version-chip {
      color: var(--accent-strong);
      background: color-mix(in srgb, var(--surface) 88%, var(--mint) 12%);
    }

    .secondary-btn {
      color: var(--ink);
      background: color-mix(in srgb, var(--surface) 90%, transparent);
      text-decoration: none;
      cursor: pointer;
    }

    .panel {
      position: relative;
      overflow: hidden;
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      animation: rise-in .34s ease both;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      pointer-events: none;
      background:
        radial-gradient(480px circle at var(--progress, 0%) 0%, color-mix(in srgb, var(--mint) 16%, transparent), transparent 42%);
      opacity: .8;
    }

    .panel-inner {
      position: relative;
      display: grid;
      gap: 22px;
      padding: clamp(20px, 4vw, 34px);
    }

    .status-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 20px;
    }

    .status-kicker {
      margin: 0 0 8px;
      color: var(--accent-strong);
      font-size: .82rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .status-title {
      margin: 0;
      font-size: clamp(1.35rem, 3vw, 2.15rem);
      line-height: 1.06;
      letter-spacing: 0;
    }

    .status-message {
      margin: 10px 0 0;
      color: var(--muted);
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .meter-orb {
      position: relative;
      width: clamp(112px, 18vw, 154px);
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        conic-gradient(var(--mint) calc(var(--pct, 0) * 1%), color-mix(in srgb, var(--line) 70%, transparent) 0),
        color-mix(in srgb, var(--surface-soft) 78%, transparent);
      box-shadow: inset 0 0 0 1px var(--line), 0 18px 42px color-mix(in srgb, var(--accent) 18%, transparent);
    }

    .meter-orb::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--line);
    }

    .meter-orb::after {
      content: "";
      position: absolute;
      inset: -9px;
      border-radius: 50%;
      border: 1px solid color-mix(in srgb, var(--mint) 52%, transparent);
      animation: pulse-ring 1.8s ease-out infinite;
    }

    .meter-value {
      position: relative;
      z-index: 1;
      font-size: clamp(1.45rem, 4vw, 2.25rem);
      font-weight: 900;
      color: var(--ink);
    }

    .progress-shell {
      height: 16px;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface-soft) 82%, transparent);
    }

    .progress-fill {
      width: var(--pct, 0%);
      height: 100%;
      border-radius: inherit;
      background:
        linear-gradient(90deg, transparent 0 16%, rgba(255,255,255,.32) 16% 30%, transparent 30% 44%),
        linear-gradient(90deg, var(--accent), var(--mint));
      background-size: 44px 100%, 100% 100%;
      animation: progress-run 1s linear infinite;
      transition: width .35s cubic-bezier(.2, .75, .2, 1);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      min-height: 86px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--surface-soft) 62%, transparent);
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .metric strong {
      display: block;
      margin-top: 8px;
      font-size: 1rem;
      overflow-wrap: anywhere;
    }

    .activity {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      color: var(--muted);
      font-weight: 700;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 3px solid color-mix(in srgb, var(--accent) 18%, transparent);
      border-top-color: var(--mint);
      animation: orbit-spin .75s linear infinite;
      flex: 0 0 auto;
    }

    .failed .progress-fill {
      background: linear-gradient(90deg, var(--danger), var(--warning));
      animation: none;
    }

    .failed .meter-orb {
      background:
        conic-gradient(var(--danger) calc(var(--pct, 0) * 1%), color-mix(in srgb, var(--line) 70%, transparent) 0),
        color-mix(in srgb, var(--surface-soft) 78%, transparent);
    }

    @media (max-width: 720px) {
      .wrap { align-content: start; }
      .status-row { grid-template-columns: 1fr; }
      .meter-orb { width: min(56vw, 150px); justify-self: center; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5" />
            <path d="m5 12 7-7 7 7" />
            <path d="M5 19h14" />
          </svg>
        </div>
        <div>
          <h1>Drop Air Updater</h1>
          <p class="subtitle">Installing the newest release without the terminal.</p>
        </div>
      </div>
      <a class="secondary-btn" href="{{ dashboard_url }}">Dashboard</a>
    </header>

    <section id="updatePanel" class="panel" style="--progress: 0%;">
      <div class="panel-inner">
        <div class="status-row">
          <div>
            <p id="updatePhase" class="status-kicker">Preparing</p>
            <h2 id="updateLabel" class="status-title">Preparing update</h2>
            <p id="updateMessage" class="status-message">Waiting for updater status...</p>
          </div>
          <div id="updateMeter" class="meter-orb" style="--pct: 0;">
            <span id="updatePercent" class="meter-value">0%</span>
          </div>
        </div>

        <div class="progress-shell" role="progressbar" aria-label="Update progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="updateProgressBar" class="progress-fill"></div>
        </div>

        <div class="metrics">
          <div class="metric">
            <span>ETA</span>
            <strong id="updateEta">Calculating</strong>
          </div>
          <div class="metric">
            <span>Speed</span>
            <strong id="updateSpeed">0 B/s</strong>
          </div>
          <div class="metric">
            <span>Downloaded</span>
            <strong id="updateBytes">0 B</strong>
          </div>
          <div class="metric">
            <span>Version</span>
            <strong id="updateVersion">{{ app_version }}</strong>
          </div>
        </div>

        <div class="activity">
          <span id="updateSpinner" class="spinner" aria-hidden="true"></span>
          <span id="updateActivity">Connecting to updater...</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    const initialStatus = {{ status|tojson }};
    const authQuery = {{ auth_query|tojson }};
    const statusUrl = `/api/admin/update/status${authQuery}`;
    const panel = document.getElementById("updatePanel");
    const phase = document.getElementById("updatePhase");
    const label = document.getElementById("updateLabel");
    const message = document.getElementById("updateMessage");
    const percent = document.getElementById("updatePercent");
    const meter = document.getElementById("updateMeter");
    const progress = document.getElementById("updateProgressBar");
    const progressShell = document.querySelector(".progress-shell");
    const eta = document.getElementById("updateEta");
    const speed = document.getElementById("updateSpeed");
    const bytes = document.getElementById("updateBytes");
    const version = document.getElementById("updateVersion");
    const activity = document.getElementById("updateActivity");
    const spinner = document.getElementById("updateSpinner");
    let failures = 0;

    function clampPercent(value) {
      const numeric = Number(value);
      if (!Number.isFinite(numeric)) return 0;
      return Math.max(0, Math.min(100, Math.round(numeric)));
    }

    function human(bytesValue) {
      const units = ["B", "KB", "MB", "GB", "TB"];
      let value = Math.max(Number(bytesValue) || 0, 0);
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) {
        value /= 1024;
        unit += 1;
      }
      return `${value.toFixed(value >= 10 || unit === 0 ? 0 : 1)} ${units[unit]}`;
    }

    function formatEta(seconds) {
      if (seconds === null || seconds === undefined || !Number.isFinite(Number(seconds))) return "Calculating";
      const value = Math.max(0, Math.round(Number(seconds)));
      const mins = Math.floor(value / 60);
      const secs = value % 60;
      return mins ? `${mins}m ${String(secs).padStart(2, "0")}s` : `${secs}s`;
    }

    function applyStatus(data) {
      const pct = clampPercent(data.percent);
      const total = Number(data.total) || 0;
      const current = Number(data.current) || 0;
      panel.classList.toggle("failed", data.ok === false || data.phase === "failed");
      panel.style.setProperty("--progress", `${pct}%`);
      meter.style.setProperty("--pct", pct);
      progress.style.setProperty("--pct", `${pct}%`);
      progressShell.setAttribute("aria-valuenow", String(pct));
      percent.textContent = `${pct}%`;
      phase.textContent = String(data.phase || "idle").replaceAll("_", " ");
      label.textContent = data.label || "Updater";
      message.textContent = data.message || data.error || "Waiting for updater status...";
      eta.textContent = formatEta(data.eta_seconds);
      speed.textContent = `${human(data.speed_bps)}/s`;
      bytes.textContent = total ? `${human(current)} / ${human(total)}` : human(current);
      version.textContent = data.latest_version ? `${data.current_version || "{{ app_version }}"} -> ${data.latest_version}` : (data.current_version || "{{ app_version }}");

      if (data.phase === "failed" || data.ok === false) {
        activity.textContent = data.error || "Update failed.";
        spinner.hidden = true;
      } else if (data.phase === "restarting" || pct >= 100) {
        activity.textContent = "Drop Air is restarting. This page may reconnect in a moment.";
        spinner.hidden = false;
      } else if (data.running) {
        activity.textContent = "Updater is running.";
        spinner.hidden = false;
      } else {
        activity.textContent = "No update is running.";
        spinner.hidden = true;
      }
    }

    async function pollStatus() {
      try {
        const response = await fetch(statusUrl, { cache: "no-store" });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "Could not read updater status");
        failures = 0;
        applyStatus(data);
      } catch (err) {
        failures += 1;
        if (failures > 1) {
          activity.textContent = "Waiting for Drop Air to restart...";
          label.textContent = "Reconnecting";
          message.textContent = "The update process may have restarted the server.";
          spinner.hidden = false;
        }
      } finally {
        setTimeout(pollStatus, failures ? 1400 : 700);
      }
    }

    applyStatus(initialStatus);
    pollStatus();
  </script>
</body>
</html>
