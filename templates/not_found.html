<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Drop Air - {{ title }}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='brand/drop-air-logo.png') }}" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #171a1d;
      --surface: #202428;
      --ink: #edf2f4;
      --muted: #aab5ba;
      --line: #373f43;
      --accent: #22b8c8;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f7fb;
        --surface: #ffffff;
        --ink: #172033;
        --muted: #5d6f86;
        --line: #dce5ee;
        --accent: #0ea5b7;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(120deg, color-mix(in srgb, var(--accent) 16%, transparent), transparent 38%),
        var(--bg);
    }

    .card {
      width: min(460px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 24px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, .18);
    }

    .code {
      color: var(--accent);
      font-weight: 900;
      font-size: .85rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 8px 0;
      font-size: clamp(1.8rem, 8vw, 3.2rem);
      line-height: 1;
    }

    p {
      margin: 10px 0 0;
      color: var(--muted);
      font-weight: 700;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="{{ url_for('static', filename='brand/drop-air-logo.png') }}" alt="Drop Air paper plane logo" width="52" height="52" style="border-radius:14px" />
    <div class="code">404</div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <p>{{ hint }}</p>
  </main>
</body>
</html>
