<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drop Air - Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #04131f;
      --bg-2: #0a1f33;
      --ink: #ecfeff;
      --muted: #bae6fd;
      --card: rgba(255, 255, 255, 0.08);
      --line: rgba(255, 255, 255, 0.22);
      --accent: #67e8f9;
      --accent-2: #6ee7b7;
      --danger: #fb7185;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Manrope", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at -10% -10%, rgba(16, 185, 129, 0.24), transparent 60%),
        radial-gradient(900px 500px at 120% 10%, rgba(34, 211, 238, 0.22), transparent 60%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
      padding: 14px;
    }

    .card {
      width: min(460px, 95vw);
      border-radius: 20px;
      border: 1px solid var(--line);
      background: var(--card);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(6, 182, 212, 0.22);
      padding: 22px;
      animation: in .45s ease;
    }

    @keyframes in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      margin: 0;
      font-family: "Syne", sans-serif;
      text-transform: uppercase;
      letter-spacing: .02em;
      font-size: 1.5rem;
    }

    p {
      margin: 8px 0 14px;
      color: var(--muted);
      font-weight: 600;
      line-height: 1.45;
    }

    .error {
      margin-bottom: 10px;
      color: var(--danger);
      font-weight: 700;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      font: inherit;
      font-weight: 700;
      color: white;
      background: rgba(2, 6, 23, 0.35);
      margin-bottom: 10px;
      outline: none;
    }

    input:focus {
      border-color: rgba(103, 232, 249, 0.9);
      box-shadow: 0 0 0 3px rgba(103, 232, 249, 0.2);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font: inherit;
      font-weight: 800;
      color: #032a2f;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      cursor: pointer;
    }
  </style>
</head>
<body>
  <form class="card" method="post" action="/enter">
    <h1>Secure Entry</h1>
    <p>This Drop Air node is locked. Enter the access code to continue.</p>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <input name="code" placeholder="Access code" autocomplete="one-time-code" />
    <button type="submit">Unlock</button>
  </form>
</body>
</html>
