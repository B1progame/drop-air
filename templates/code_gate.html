<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Drop Air - Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #04131f;
      --bg-2: #0a1f33;
      --bg-3: #102f4b;
      --ink: #ecfeff;
      --muted: #bae6fd;
      --card: rgba(255, 255, 255, 0.08);
      --line: rgba(255, 255, 255, 0.22);
      --accent: #67e8f9;
      --accent-2: #6ee7b7;
      --danger: #fb7185;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Manrope", sans-serif;
      color: var(--ink);
      background: linear-gradient(145deg, var(--bg-1), var(--bg-2) 45%, var(--bg-3));
      padding: 14px;
      overflow-x: hidden;
      position: relative;
    }

    .bg-anim {
      position: fixed;
      inset: -12vmax;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bg-anim .cloud {
      position: absolute;
      inset: -15%;
      opacity: 0.3;
      will-change: transform, filter;
      mix-blend-mode: screen;
    }

    .bg-anim .layer-a {
      background:
        radial-gradient(38% 30% at 18% 30%, rgba(16, 185, 129, 0.45), transparent 72%),
        radial-gradient(42% 34% at 72% 22%, rgba(34, 211, 238, 0.4), transparent 76%),
        radial-gradient(46% 40% at 52% 70%, rgba(14, 165, 233, 0.32), transparent 80%);
      filter: blur(64px) saturate(110%);
      animation: cloud-drift-a 28s ease-in-out infinite alternate;
    }

    .bg-anim .layer-b {
      background:
        radial-gradient(42% 36% at 20% 70%, rgba(14, 165, 233, 0.35), transparent 74%),
        radial-gradient(36% 30% at 68% 56%, rgba(52, 211, 153, 0.38), transparent 74%),
        radial-gradient(28% 24% at 78% 18%, rgba(125, 211, 252, 0.3), transparent 70%);
      filter: blur(72px) hue-rotate(-10deg);
      animation: cloud-drift-b 36s ease-in-out infinite alternate;
    }

    .bg-anim .layer-c {
      background:
        radial-gradient(34% 28% at 40% 22%, rgba(34, 211, 238, 0.28), transparent 72%),
        radial-gradient(44% 36% at 74% 74%, rgba(16, 185, 129, 0.26), transparent 78%),
        radial-gradient(36% 32% at 16% 78%, rgba(56, 189, 248, 0.22), transparent 74%);
      filter: blur(82px) hue-rotate(4deg);
      animation: cloud-drift-c 44s ease-in-out infinite alternate;
    }

    @keyframes cloud-drift-a {
      0% { transform: translate3d(-6%, -3%, 0) scale(1.04); }
      100% { transform: translate3d(8%, 6%, 0) scale(1.14); }
    }

    @keyframes cloud-drift-b {
      0% { transform: translate3d(5%, 6%, 0) scale(1.03); filter: blur(72px) hue-rotate(-16deg); }
      100% { transform: translate3d(-8%, -5%, 0) scale(1.12); filter: blur(72px) hue-rotate(14deg); }
    }

    @keyframes cloud-drift-c {
      0% { transform: translate3d(-3%, 4%, 0) scale(1.05); filter: blur(82px) hue-rotate(0deg); }
      100% { transform: translate3d(6%, -6%, 0) scale(1.12); filter: blur(82px) hue-rotate(20deg); }
    }

    .content-shade {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(2, 6, 23, 0.14), rgba(2, 6, 23, 0.26));
    }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0.08;
      background-image: radial-gradient(circle at 1px 1px, white 1px, transparent 0);
      background-size: 3px 3px;
    }

    .card {
      position: relative;
      z-index: 3;
      width: min(460px, 95vw);
      border-radius: 20px;
      border: 1px solid var(--line);
      background: var(--card);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(6, 182, 212, 0.22);
      padding: 22px;
      animation: in .45s ease;
    }

    @keyframes in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      margin: 0;
      font-family: "Syne", sans-serif;
      text-transform: uppercase;
      letter-spacing: .02em;
      font-size: 1.5rem;
    }

    p {
      margin: 8px 0 14px;
      color: var(--muted);
      font-weight: 600;
      line-height: 1.45;
    }

    .error {
      margin-bottom: 10px;
      color: var(--danger);
      font-weight: 700;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      font: inherit;
      font-weight: 700;
      color: white;
      background: rgba(2, 6, 23, 0.35);
      margin-bottom: 10px;
      outline: none;
    }

    input:focus {
      border-color: rgba(103, 232, 249, 0.9);
      box-shadow: 0 0 0 3px rgba(103, 232, 249, 0.2);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font: inherit;
      font-weight: 800;
      color: #032a2f;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      cursor: pointer;
    }

    @media (prefers-reduced-motion: reduce) {
      .card,
      .bg-anim .cloud {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="bg-anim" aria-hidden="true">
    <div class="cloud layer-a"></div>
    <div class="cloud layer-b"></div>
    <div class="cloud layer-c"></div>
  </div>
  <div class="content-shade" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>

  <form class="card" method="post" action="/enter">
    <h1>Secure Entry</h1>
    <p>This Drop Air node is locked. Enter the access code to continue.</p>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <input name="code" placeholder="Access code" autocomplete="one-time-code" />
    <button type="submit">Unlock</button>
  </form>
</body>
</html>
